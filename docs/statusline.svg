<text x="0" y="136" xml:space="preserve" fill="#c9d1d9"><tspan x="0em" fill="#56d4dd">Sonnet 5.5</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#d29922">hi</tspan><tspan x="7.8em" fill="#6e7681"> | </tspan><tspan x="9.6em" fill="#3fb950">▕▄▏</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#3fb950">42%</tspan><tspan fill="#6e7681">/200k</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#3fb950">+1¢/call</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#6e7681">new@9</tspan><tspan x="25.8em" fill="#6e7681"> | </tspan><tspan x="27.6em" fill="#c9d1d9">$5.60 </tspan><tspan fill="#6e7681">sess</tspan><tspan x="33.6em" fill="#6e7681"> | </tspan><tspan x="35.4em" fill="#6e7681">⏱</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#3fb950">26m</tspan><tspan x="38.4em" fill="#6e7681"> | </tspan><tspan x="40.2em" fill="#3fb950">12%</tspan><tspan fill="#c9d1d9"> 4h 59m </tspan><tspan fill="#6e7681">/ 5h</tspan><tspan x="49.2em" fill="#6e7681"> | </tspan><tspan x="51em" fill="#d29922">55%</tspan><tspan fill="#c9d1d9"> 6d 23h </tspan><tspan fill="#6e7681">/ 7d</tspan></text>
