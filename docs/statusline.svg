<g stroke="#6e7681"><line x1="40.2em" y1="146" x2="49.2em" y2="146"/><line x1="40.2em" y1="142" x2="40.2em" y2="146"/><line x1="49.2em" y1="142" x2="49.2em" y2="146"/><line x1="44.7em" y1="146" x2="44.7em" y2="168"/></g>
<circle cx="44.7em" cy="178" r="10" fill="#1f6feb"/><text x="44.7em" y="182.5" text-anchor="middle" fill="#fff"><tspan font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700">6</tspan></text>
<g stroke="#6e7681"><line x1="51em" y1="146" x2="60em" y2="146"/><line x1="51em" y1="142" x2="51em" y2="146"/><line x1="60em" y1="142" x2="60em" y2="146"/><line x1="55.5em" y1="146" x2="55.5em" y2="168"/></g>
<circle cx="55.5em" cy="178" r="10" fill="#1f6feb"/><text x="55.5em" y="182.5" text-anchor="middle" fill="#fff"><tspan font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700">7</tspan></text>
</g>
<circle cx="32" cy="216" r="10" fill="#1f6feb"/><text x="32" y="220.5" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
<text x="54" y="220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">Model</text><text x="180" y="220" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9" opacity="0.85">Active model. <tspan font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">xN</tspan> = input price vs your base model (hidden at x1). Effort: lo dim, med green, hi yellow, xhi/max red.</text>
<circle cx="32" cy="246" r="10" fill="#1f6feb"/><text x="32" y="250.5" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
<text x="54" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">Context window</text><text x="180" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9" opacity="0.85">Bordered fill indicator (<tspan font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">&#x2595;&#x2581;&#x258F; &#x2595;&#x2584;&#x258F; &#x2595;&#x2588;&#x258F;</tspan>), percent used, window size. Green &lt;50%, yellow 50-80%, red &#x2265;80%.</text>
<circle cx="32" cy="276" r="10" fill="#1f6feb"/><text x="32" y="280.5" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">3</text>
<text x="54" y="280" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">Overhead</text><text x="180" y="280" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9" opacity="0.85">Extra cost per call of re-reading this context vs a fresh session; <tspan font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">new@N</tspan> = fresh is cheaper after N calls.</text>
<circle cx="32" cy="306" r="10" fill="#1f6feb"/><text x="32" y="310.5" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">4</text>
<text x="54" y="310" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">Session cost</text><text x="180" y="310" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9" opacity="0.85">Cost of the current session in USD (resets with a new session).</text>
<circle cx="32" cy="336" r="10" fill="#1f6feb"/><text x="32" y="340.5" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">5</text>
<text x="54" y="340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">Prompt cache</text><text x="180" y="340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9" opacity="0.85">Minutes until the cache expires (yellow &lt; 20, red &lt; 5); <tspan font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">&#x23F1; cold</tspan> = expired. Hit rate only below 80% (red).</text>
<circle cx="32" cy="366" r="10" fill="#1f6feb"/><text x="32" y="370.5" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">6</text>
<text x="54" y="370" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">5-hour window</text><text x="180" y="370" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9" opacity="0.85">Percent used, time left until reset / window length. Yellow from 50%, red from 80%.</text>
<circle cx="32" cy="396" r="10" fill="#1f6feb"/><text x="32" y="400.5" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">7</text>
<text x="54" y="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">7-day window</text><text x="180" y="400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#c9d1d9" opacity="0.85">Same format for the weekly limit. A gateway spend limit shows the same way, e.g. &quot;81% 21d 23h / 30d&quot;.</text>
<line x1="20" y1="420" x2="1028" y2="420" stroke="#30363d"/>
<rect x="20" y="429" width="12" height="12" rx="2" fill="#3fb950"/><text x="38" y="440" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">ok</text>
<rect x="80" y="429" width="12" height="12" rx="2" fill="#d29922"/><text x="98" y="440" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">warn</text>
<rect x="156" y="429" width="12" height="12" rx="2" fill="#f85149"/><text x="174" y="440" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">critical</text>
<text x="274" y="440" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6e7681">Sections are separated by a dim &#x201C;|&#x201D;. Breakpoints, sections and windows are configurable: see Settings.</text>
