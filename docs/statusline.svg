<g stroke="#6e7681"><line x1="35.4em" y1="146" x2="38.4em" y2="146"/><line x1="35.4em" y1="142" x2="35.4em" y2="146"/><line x1="38.4em" y1="142" x2="38.4em" y2="146"/><line x1="36.9em" y1="146" x2="36.9em" y2="168"/></g>
