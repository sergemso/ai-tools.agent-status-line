name: Release

# Per-package releases driven by Conventional Commits (release-please).
#
# Every push to main updates one Release PR per changed package. Merging a
# Release PR bumps that package's version and changelog, tags it
# (core-vX.Y.Z, opencode-plugin-vX.Y.Z, claude-code-vX.Y.Z), and the publish
# job below ships only the packages that were released.
#
# Commit scope does not select a package — changed file paths do:
#   packages/core            -> @statusline/core
#   packages/opencode-plugin -> @statusline/opencode-plugin
#   everything else (src/, hooks/, commands/, ...) -> @statusline/claude-plugin
# node-workspace also bumps dependents when core is released.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PRs opened with GITHUB_TOKEN don't trigger CI. Set a PAT (or app
          # token) as RELEASE_PLEASE_TOKEN so Release PRs get checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    env:
      RELEASED: ${{ needs.release-please.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: |
          npm run build:core
          npm run build
          npm run build:opencode

      - name: Test
        run: npm test

      # Order matters: the other two packages depend on core.
      - name: Publish @statusline/core
        if: contains(fromJSON(env.RELEASED), 'packages/core')
        run: npm publish --workspace=@statusline/core --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @statusline/opencode-plugin
        if: contains(fromJSON(env.RELEASED), 'packages/opencode-plugin')
        run: npm publish --workspace=@statusline/opencode-plugin --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @statusline/claude-plugin
        if: contains(fromJSON(env.RELEASED), '.')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
