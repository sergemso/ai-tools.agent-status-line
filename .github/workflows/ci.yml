name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege; releases live in release.yml
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build core package
        run: npm run build:core

      - name: Build CLI
        run: npm run build

      - name: Build opencode plugin
        run: npm run build --workspace=@statusline/opencode-plugin

      - name: Run tests
        run: npm test

      - name: Type-check (no emit)
        run: npx tsc --noEmit

      # Installs the packed tarballs into an empty directory, as a registry
      # install would. Catches files missing from the published packages.
      - name: Smoke-test packed tarballs
        run: npm run smoke:pack

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true # eslint config not finalized yet
